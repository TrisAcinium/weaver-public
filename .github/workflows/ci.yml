name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Data Linter
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Verify Showcase Compilation
        run: |
          cd examples/01-hello-weaver && make
          cd ../02-pipelines-and-flow && make
          cd ../03-schema-inheritance && make
